apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpt2
  namespace: default
  labels:
    app: gpt2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gpt2
  template:
    metadata:
      labels:
        app: gpt2
    spec:
      volumes:
      # vLLM needs to access the host's shared memory for tensor parallel inference.
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: "2Gi"
      containers:
      - name: gpt2
        image: vllm/vllm-openai:v0.7.3
        command: ["/bin/sh", "-c"]
        args: ["vllm serve openai-community/gpt2 --enable-sleep-mode --enforce-eager"]
        env:
        - name: VLLM_USE_V1
          value: "1"
        - name: VLLM_LOGGING_LEVEL
          value: "DEBUG"
        - name: VLLM_SERVER_DEV_MODE
          value: "1"
        ports:
        - containerPort: 8000
        resources:
          limits:
            cpu: "4"
            memory: 20G
            nvidia.com/gpu: "1"
          requests:
            cpu: "2"
            memory: 6G
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: shm
          mountPath: /dev/shm
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 5