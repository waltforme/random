---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-dp0
  labels:
    app: vllm-dp0
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-dp0
  template:
    metadata:
      labels:
        app: vllm-dp0
    spec:
      containers:
      - name: vllm
        image: vllm/vllm-openai:v0.10.2
        command:
          - vllm
          - serve
          - "--model=ibm-granite/granite-3.3-2b-instruct"
          - "--max-model-len=8192"
          - "--data-parallel-size=2"
          - "--data-parallel-rank=0"
          - "--data-parallel-address=0.0.0.0"
          - "--data-parallel-rpc-port=13345"
          - "--port=8000"
        env:
        - name: NCCL_DEBUG
          value: INFO
        - name: CUDA_VISIBLE_DEVICES
          value: "0"
        - name: VLLM_SERVER_DEV_MODE
          value: "1"
        - name: VLLM_CACHE_ROOT
          value: /tmp
        - name: FLASHINFER_WORKSPACE_BASE
          value: /tmp
        - name: XDG_CONFIG_HOME
          value: /tmp
        - name: TRITON_HOME
          value: /tmp
        - name: HF_HOME
          value: /tmp
        ports:
          - containerPort: 8000
          - containerPort: 13345
        resources:
          limits:
            cpu: "2"
            memory: "16Gi"
          requests:
            cpu: "1"
            memory: "8Gi"
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 5
  strategy:
    type: Recreate
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-dp1
  labels:
    app: vllm-dp1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-dp1
  template:
    metadata:
      labels:
        app: vllm-dp1
    spec:
      containers:
      - name: vllm
        image: vllm/vllm-openai:v0.10.2
        command:
          - vllm
          - serve
          - "--model=ibm-granite/granite-3.3-2b-instruct"
          - "--max-model-len=8192"
          - "--data-parallel-size=2"
          - "--data-parallel-rank=1"
          - "--data-parallel-address=10.101.21.189"
          - "--data-parallel-rpc-port=13345"
          - "--port=8001"
        env:
        - name: NCCL_DEBUG
          value: INFO
        - name: CUDA_VISIBLE_DEVICES
          value: "1"
        - name: VLLM_SERVER_DEV_MODE
          value: "1"
        - name: VLLM_CACHE_ROOT
          value: /tmp
        - name: FLASHINFER_WORKSPACE_BASE
          value: /tmp
        - name: XDG_CONFIG_HOME
          value: /tmp
        - name: TRITON_HOME
          value: /tmp
        - name: HF_HOME
          value: /tmp
        ports:
          - containerPort: 8001
        resources:
          limits:
            cpu: "2"
            memory: "16Gi"
          requests:
            cpu: "1"
            memory: "8Gi"
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 60
          periodSeconds: 5
